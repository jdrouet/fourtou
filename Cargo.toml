[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Jeremie Drouet <jeremie.drouet@gmail.com>"]

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false }
bytes = { version = "1", default-features = false }
fourtou-adapters = { path = "crates/fourtou-adapters" }
fourtou-app = { path = "crates/fourtou-app" }
fourtou-config = { path = "crates/fourtou-config" }
fourtou-domain = { path = "crates/fourtou-domain" }
futures = { version = "0.3", default-features = false }
http-body-util = { version = "0.1", default-features = false }
pin-project-lite = { version = "0.2", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", default-features = false }
tokio-test = { version = "0.4", default-features = false }
toml = { version = "1.0", default-features = false }
tower = { version = "0.5", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
wiremock = { version = "0.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
